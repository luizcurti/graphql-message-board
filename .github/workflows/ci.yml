name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  back-end:
    name: Back-end (lint, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --ci

      - name: E2E tests
        run: npm run test:e2e -- --ci

  front-end:
    name: Front-end (build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Build
        run: npm run build

  collection:
    name: Postman collection (happy + sad paths)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start server
        run: node dist/main.js &

      - name: Wait for the GraphQL endpoint
        run: npx wait-on -t 30000 tcp:localhost:3333

      - name: Run Postman collection
        run: npm run test:collection

  integration:
    name: Docker Compose integration (curl + real browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and start the stack
        run: docker compose up --build -d

      - name: Wait for both services to be reachable
        run: npx wait-on -t 60000 tcp:localhost:3333 tcp:localhost:3000

      - name: Run integration script
        run: bash e2e-integration-test.sh

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run browser E2E tests
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
