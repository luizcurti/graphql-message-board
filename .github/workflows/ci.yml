name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # "Run workflow" on main re-runs the pipeline and deploys, e.g. to recreate the stack after
  # the Destroy workflow.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main mid-deploy (it could leave a Terraform state lock behind).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  back-end:
    name: Back-end (audit, lint, typecheck, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Security audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=critical

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Unit tests (100% coverage required)
        run: npm run test:cov -- --ci

      - name: E2E tests
        run: npm run test:e2e -- --ci

  front-end:
    name: Front-end (audit, typecheck, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Security audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=critical

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests (100% coverage required)
        run: npm run test:cov
        env:
          CI: true

      - name: Build
        run: npm run build

  collection:
    name: Postman collection (happy + sad paths)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start server
        run: node dist/main.js &

      - name: Wait for the GraphQL endpoint
        run: npx wait-on -t 30000 tcp:localhost:3333

      - name: Run Postman collection
        run: npm run test:collection

  integration:
    name: Docker Compose integration (curl + real browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build and start the stack
        run: docker compose up --build -d

      - name: Wait for both services to be reachable
        run: npx wait-on -t 60000 tcp:localhost:3333 tcp:localhost:3000

      - name: Run integration script
        run: bash e2e-integration-test.sh

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run browser E2E tests
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  infra:
    name: Terraform fmt + validate (infra, bootstrap)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
      - name: infra
        working-directory: infra
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: bootstrap
        working-directory: bootstrap
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  # Deploys to real AWS on every push to main (or manual run on main), once every check passes.
  # Auth is GitHub OIDC -> IAM role (bootstrap/), so no AWS keys are stored in GitHub.
  # Configuration lives in the `production` GitHub environment (docs/deployment.md); until
  # AWS_DEPLOY_ROLE_ARN is set there, the job skips the AWS steps and stays green.
  deploy:
    name: Deploy to AWS
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [back-end, front-end, collection, integration, infra]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_backend_image_tag: ${{ github.sha }}
      TF_IN_AUTOMATION: 'true'
    steps:
      - name: Check deploy configuration
        id: config
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::notice title=Deploy skipped::AWS_DEPLOY_ROLE_ARN is not set in the production environment. Run scripts/bootstrap.sh (see docs/deployment.md)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=""
          [ -z "$AWS_REGION" ] && missing="$missing AWS_REGION"
          [ -z "$STATE_BUCKET" ] && missing="$missing TF_STATE_BUCKET"
          if [ -n "$missing" ]; then
            echo "::error title=Deploy misconfigured::Missing in the production environment:$missing"
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.config.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.config.outputs.enabled == 'true'
        with:
          node-version: 24

      - name: Configure AWS credentials (OIDC)
        if: steps.config.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        if: steps.config.outputs.enabled == 'true'
        with:
          terraform_wrapper: false

      # The S3 backend is only added here, at deploy time, so local runs keep local state.
      - name: Terraform init (S3 remote state)
        if: steps.config.outputs.enabled == 'true'
        working-directory: infra
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          cat > ci_backend.tf <<'EOF'
          terraform {
            backend "s3" {}
          }
          EOF
          terraform init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=graphql-message-board/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      # The ECS service needs the image to exist, so the registry comes first (a no-op after the
      # first deploy), then the image is pushed, then the rest of the stack is applied.
      - name: Terraform apply (ECR repository)
        if: steps.config.outputs.enabled == 'true'
        working-directory: infra
        shell: bash
        run: terraform apply -input=false -no-color -auto-approve -target=aws_ecr_repository.backend 2>&1 | tee ecr.log

      - name: Build and push the backend image
        if: steps.config.outputs.enabled == 'true'
        id: image
        run: |
          REPO=$(terraform -chdir=infra output -raw ecr_repository_url)
          aws ecr get-login-password | docker login --username AWS --password-stdin "${REPO%%/*}"
          docker build -t "$REPO:${{ github.sha }}" back-end
          docker push "$REPO:${{ github.sha }}"

      - name: Terraform plan
        if: steps.config.outputs.enabled == 'true'
        working-directory: infra
        shell: bash
        run: terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan.log

      - name: Terraform apply
        if: steps.config.outputs.enabled == 'true'
        working-directory: infra
        shell: bash
        run: terraform apply -input=false -no-color tfplan 2>&1 | tee apply.log

      # Surface each Terraform "Error:" block as a run annotation, so failures are readable
      # from the run summary / checks API without downloading the raw job log.
      - name: Report Terraform errors
        if: failure() && steps.config.outputs.enabled == 'true'
        working-directory: infra
        run: |
          for f in ecr.log plan.log apply.log; do
            [ -f "$f" ] || continue
            awk '{ gsub(/%/, "%25") }
                 /^Error: / { if (buf) print buf; buf = $0; n = 0; next }
                 buf && n < 15 { buf = buf "%0A" $0; n++ }
                 END { if (buf) print buf }' "$f" |
              while IFS= read -r block; do echo "::error title=Terraform ($f)::${block}"; done
          done

      - name: Wait for the backend service
        if: steps.config.outputs.enabled == 'true'
        run: |
          aws ecs wait services-stable \
            --cluster "$(terraform -chdir=infra output -raw ecs_cluster)" \
            --services "$(terraform -chdir=infra output -raw ecs_service)"

      # The SPA bakes the API URL in at build time, so it is built here, after apply, with the
      # CloudFront domain. Hashed assets are cached for a year; index.html is never cached.
      - name: Build and upload the frontend
        if: steps.config.outputs.enabled == 'true'
        working-directory: front-end
        run: |
          BUCKET=$(terraform -chdir=../infra output -raw frontend_bucket)
          export REACT_APP_GRAPHQL_URL=$(terraform -chdir=../infra output -raw graphql_url)
          npm ci
          npm run build
          aws s3 sync build "s3://$BUCKET" --delete --exclude index.html \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp build/index.html "s3://$BUCKET/index.html" --cache-control "no-cache"
          aws cloudfront create-invalidation \
            --distribution-id "$(terraform -chdir=../infra output -raw cloudfront_distribution_id)" \
            --paths "/index.html" "/" > /dev/null

      # The same full-stack script CI runs against Docker Compose (SPA routes, the bundle's API
      # URL, CORS, every query/mutation, the WebSocket subscription), against the live stack.
      - name: Smoke tests (real AWS)
        if: steps.config.outputs.enabled == 'true'
        run: |
          APP_URL=$(terraform -chdir=infra output -raw app_url)
          BACKEND_URL="$APP_URL" FRONTEND_URL="$APP_URL" bash e2e-integration-test.sh
          {
            echo "### Deployed :rocket:"
            echo "App: ${APP_URL}"
            echo
            echo "GraphQL: ${APP_URL}/graphql"
          } >> "$GITHUB_STEP_SUMMARY"
